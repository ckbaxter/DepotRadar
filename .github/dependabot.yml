version: 2
updates:
  # Python/pip Abhängigkeiten
  # Minor- und Patch-Updates kommen gebündelt in einem PR, Major-Updates einzeln.
  # Cooldown: neue Releases werden erst nach 7 Tagen vorgeschlagen (Security-Updates sind davon ausgenommen).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Docker Base Image
  # ⚠ Die Python-Version steht auch in .github/workflows/backend-image.yml (setup-python) —
  # bei einem Bump des Base Images dort mitziehen.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
      timezone: Europe/Berlin

  # GitHub Actions (Workflows in .github/workflows/)
  # Alle Action-Updates (u. a. die vier docker/*-Actions) kommen gebündelt in einem PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
