name: Web-Image

# Baut das Web-Image (nginx mit eingebackenem Frontend und eingebackener nginx.conf) und
# veröffentlicht es in der GitHub Container Registry (ghcr.io/ckbaxter/depotradar-web).
# Ausgelöst wird nur durch ein Tag `frontend-v<VERSION>`, z. B. `frontend-v2.13.88` — nicht durch
# normale Pushes. Die Version ist frontend_version aus frontend/changelog.json.
# Zusätzlich manuell startbar (Actions → Web-Image → Run workflow), entweder auf einem Tag
# `frontend-v*` oder auf `main` (baut dann die frontend_version aus frontend/changelog.json neu).
# Plattformen: linux/amd64 und linux/arm64.
on:
  push:
    tags: ["frontend-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Das Skript prüft, dass VERSION in app.py, die README-Badges und der jüngste Changelog-Eintrag
      # zu changelog.json passen, beim Tag-Build zusätzlich den Tag. Manueller Start ist nur auf
      # einem Tag oder auf main erlaubt.
      - name: Version prüfen
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              frontend-v*) ;;
              *) echo "::error::Dieses Image wird nur durch Tags frontend-v* gebaut (gewählt: $GITHUB_REF_NAME)"; exit 1;;
            esac
            python scripts/sync-version.py --check --tag "$GITHUB_REF_NAME"
          else
            [ "$GITHUB_REF_NAME" = "main" ] || { echo "::error::Manueller Start nur auf main oder einem Tag frontend-v* (gewählt: $GITHUB_REF_NAME)"; exit 1; }
            python scripts/sync-version.py --check
          fi
          V=$(python -c "import json; print(json.load(open('frontend/changelog.json', encoding='utf-8'))['frontend_version'])")
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Testbuild (nur amd64, wird nicht veröffentlicht): die eingebackene nginx-Konfiguration muss gültig sein.
      # Der Hostname "backend" steht in proxy_pass und muss beim Prüfen auflösbar sein.
      - name: Testbuild und nginx-Konfiguration prüfen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx/Dockerfile
          load: true
          tags: depotradar-web:test
          cache-from: type=gha,scope=web

      - name: nginx -t
        run: docker run --rm --add-host backend:127.0.0.1 depotradar-web:test nginx -t

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ckbaxter/depotradar-web:${{ steps.ver.outputs.v }}
            ghcr.io/ckbaxter/depotradar-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
