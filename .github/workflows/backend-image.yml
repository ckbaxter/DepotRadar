name: Backend-Image

# Baut das Backend-Image und veröffentlicht es in der GitHub Container Registry
# (ghcr.io/ckbaxter/depotradar-backend). Ausgelöst wird nur durch ein Tag
# `backend-v<VERSION>`, z. B. `backend-v2.8.47` — nicht durch normale Pushes.
# Zusätzlich manuell startbar (Actions → Backend-Image → Run workflow), entweder
# auf einem Tag `backend-v*` oder auf `main` (baut dann die backend_version aus
# frontend/changelog.json neu).
# Plattformen: linux/amd64 und linux/arm64.
on:
  push:
    tags: ["backend-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Die Python-Version steht nur im Dockerfile (FROM python:X.Y-...). Die CI nutzt dieselbe,
      # damit ein Update des Base Images (z. B. durch Dependabot) hier automatisch mitzieht.
      - name: Python-Version aus Dockerfile lesen
        id: py
        run: |
          V=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+).*/\1/p' backend/Dockerfile | head -n1)
          [ -n "$V" ] || { echo "::error::Python-Version in backend/Dockerfile nicht gefunden (erwartet: FROM python:X.Y...)"; exit 1; }
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.py.outputs.v }}

      # Die Version kommt aus frontend/changelog.json (backend_version). Das Skript prüft, dass
      # VERSION in app.py, die README-Badges und der jüngste Changelog-Eintrag dazu passen,
      # beim Tag-Build zusätzlich den Tag. Manueller Start ist nur auf einem Tag oder auf main erlaubt.
      - name: Version prüfen
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              backend-v*) ;;
              *) echo "::error::Dieses Image wird nur durch Tags backend-v* gebaut (gewählt: $GITHUB_REF_NAME)"; exit 1;;
            esac
            python scripts/sync-version.py --check --tag "$GITHUB_REF_NAME"
          else
            [ "$GITHUB_REF_NAME" = "main" ] || { echo "::error::Manueller Start nur auf main oder einem Tag backend-v* (gewählt: $GITHUB_REF_NAME)"; exit 1; }
            python scripts/sync-version.py --check
          fi
          V=$(python -c "import json; print(json.load(open('frontend/changelog.json', encoding='utf-8'))['backend_version'])")
          echo "v=$V" >> "$GITHUB_OUTPUT"

      # `latest` nur für die neueste Version (seit Frontend v2.13.98): ein manueller Lauf auf einem
      # älteren Tag würde sonst `latest` zurücksetzen, und `docker compose pull` holte die alte Version.
      # Verglichen wird mit allen backend-v-Tags auf GitHub (sort -V); die gebaute Version zählt mit.
      - name: Prüfen, ob dies die neueste Version ist
        id: latest
        env:
          V: ${{ steps.ver.outputs.v }}
        run: |
          NEWEST=$( { git ls-remote --tags --refs origin 'refs/tags/backend-v*' | sed -E 's#.*refs/tags/backend-v##'; echo "$V"; } | sort -V | tail -n1 )
          if [ "$NEWEST" = "$V" ]; then
            echo "tag=ghcr.io/ckbaxter/depotradar-backend:latest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::backend-v$V ist nicht die neueste Version (neueste: backend-v$NEWEST) — latest bleibt unverändert."
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax prüfen
        run: |
          python -m pip install pyflakes
          python -c "import ast; ast.parse(open('backend/app.py').read())"
          python -m pyflakes backend/app.py

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ckbaxter/depotradar-backend:${{ steps.ver.outputs.v }}
            ${{ steps.latest.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
