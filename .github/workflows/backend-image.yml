name: Backend-Image

# Baut das Backend-Image und veröffentlicht es in der GitHub Container Registry
# (ghcr.io/ckbaxter/depotradar-backend). Ausgelöst wird nur durch ein Tag
# `backend-v<VERSION>`, z. B. `backend-v2.8.47` — nicht durch normale Pushes.
# Zusätzlich manuell startbar (Actions → Backend-Image → Run workflow), entweder
# auf einem Tag `backend-v*` oder auf `main` (baut dann die backend_version aus
# frontend/changelog.json neu).
# Plattformen: linux/amd64 und linux/arm64.
on:
  push:
    tags: ["backend-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Die Version kommt aus frontend/changelog.json (backend_version). Das Skript prüft, dass
      # VERSION in app.py, die README-Badges und der jüngste Changelog-Eintrag dazu passen,
      # beim Tag-Build zusätzlich den Tag. Manueller Start ist nur auf einem Tag oder auf main erlaubt.
      - name: Version prüfen
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python scripts/sync-version.py --check --tag "$GITHUB_REF_NAME"
          else
            [ "$GITHUB_REF_NAME" = "main" ] || { echo "::error::Manueller Start nur auf main oder einem Tag backend-v* (gewählt: $GITHUB_REF_NAME)"; exit 1; }
            python scripts/sync-version.py --check
          fi
          V=$(python -c "import json; print(json.load(open('frontend/changelog.json', encoding='utf-8'))['backend_version'])")
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Syntax prüfen
        run: |
          python -m pip install pyflakes
          python -c "import ast; ast.parse(open('backend/app.py').read())"
          python -m pyflakes backend/app.py

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ckbaxter/depotradar-backend:${{ steps.ver.outputs.v }}
            ghcr.io/ckbaxter/depotradar-backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
