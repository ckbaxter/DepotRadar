# ── Rate-Limits (seit v2.8.41) ────────────────────────────────────────────────
# Diese Datei wird von nginx im http-Kontext eingebunden — die Zonen dürfen daher hier stehen.
# Schlüssel = Client-IP. Ein LEERER Schlüssel bedeutet "nicht gezählt": so genügt ein einziges
# `location /api/`, und alle Zonen gelten gleichzeitig (eine Anfrage wird abgelehnt, sobald
# irgendeine Zone überschritten ist).
#
# Client-IP: Hinter einem Reverse Proxy (z. B. Nginx Proxy Manager) übernimmt nginx die echte
# Client-IP aus dem Header X-Real-IP (siehe „Echte Client-IP“ unten); ohne Proxy gilt die
# Verbindungs-IP. Prüfen: `docker compose logs nginx | tail` (erste Spalte = Client-IP).
#
# Werte-Begründung: das Frontend schleift sequenziell über Ticker (ATH-Prüfung, Watchlist-Refresh);
# jeder Aufruf wartet auf die Antwort → ca. 1–5 Anfragen/s. Dazu Fortschritts-Polling (2/s).
# Das bleibt sicher unter den Grenzen; ein Skript oder Dauerklicken läuft dagegen auf.

# Ganze Depot-Operationen, die viele Yahoo-/Parqet-Aufrufe im Backend auslösen: max. 1 je 10 s
map $uri $rl_heavy_key {
    ~^/api/stocks/refresh-all$                                    $binary_remote_addr;
    ~^/api/depots/[^/]+/(parqet/(sync|import-bulk)|ath-check)$    $binary_remote_addr;
    default                                                       "";
}

# Einzelne Aufrufe, die je 1–3 Anfragen an Yahoo/Wikipedia/Frankfurt auslösen
map $uri $rl_outbound_key {
    ~^/api/stocks/[^/]+/refresh$                                  $binary_remote_addr;
    ~^/api/watchlists/[^/]+/stocks/[^/]+/refresh$                 $binary_remote_addr;
    ~^/api/stocks/[^/]+/(info|history)$                           $binary_remote_addr;
    ~^/api/(ath-check-single|search|splits/suggest|etf-history)$  $binary_remote_addr;
    default                                                       "";
}

# PIN-Prüfung: begrenzt die Versuche je Client-IP (zone rl_pin, siehe unten). Das ist aktuell die
# EINZIGE Bremse gegen Durchprobieren — das Backend zählt keine Fehlversuche und sperrt keinen
# Benutzer. Hinter dem Docker-Gateway teilen sich alle Clients eine IP und damit dieses Limit (siehe Hinweis oben).
map $uri $rl_pin_key {
    ~^/api/users/[^/]+/verify-pin$                                $binary_remote_addr;
    default                                                       "";
}

limit_req_zone $rl_heavy_key       zone=rl_heavy:1m    rate=6r/m;
limit_req_zone $rl_outbound_key    zone=rl_outbound:1m rate=10r/s;
limit_req_zone $rl_pin_key         zone=rl_pin:1m      rate=10r/m;
limit_req_zone $binary_remote_addr zone=rl_general:1m  rate=30r/s;

limit_req_status    429;
limit_req_log_level warn;

# ── Echte Client-IP hinter dem Reverse Proxy (seit Frontend v2.13.98) ─────────────────────────
# Ohne diese Angaben sieht nginx nur die IP des Proxys bzw. des Docker-Gateways — alle Clients
# teilen sich dann die Rate-Limits oben, auch die PIN-Bremse rl_pin. Vertraut werden nur private
# Netze (wie es Nginx Proxy Manager selbst tut): kommt eine Anfrage von dort, gilt die IP aus
# X-Real-IP (setzt NPM auf die echte Client-IP). Nebenwirkung: ein Gerät im Heimnetz, das Port
# WEB_PORT direkt anspricht, könnte X-Real-IP selbst setzen und so die Limits umgehen — bei rein
# internem Betrieb vertretbar, die Limits sind ohnehin nur eine Bremse.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;   # u. a. Docker-Netze
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header   X-Real-IP;

# ── Kompression (seit Frontend v2.13.98) ──────────────────────────────────────────────────────
# index.html (~550 KB), changelog.json und die API-Antworten (JSON) schrumpfen auf rund ein
# Viertel. text/html ist bei gzip immer dabei. Schon komprimierte Antworten reicht ein
# vorgeschalteter Proxy unverändert durch.
gzip            on;
gzip_vary       on;
gzip_proxied    any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types      application/json application/javascript text/css text/plain image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Versionsnummer von nginx nicht preisgeben
    server_tokens off;

    # Security-Header (gelten fuer alle Locations ohne eigenes add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # HTML immer neu prüfen — neue Versionen werden sofort geladen. „no-cache“ (ohne „no-store“,
    # seit Frontend v2.13.98): der Browser darf die Seite behalten, fragt aber bei jedem Aufruf
    # per ETag nach und bekommt bei unverändertem Stand nur ein kurzes 304 statt der ganzen Datei.
    # Hinweis: add_header in einer location ersetzt die Server-Header -> hier wiederholen
    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Aenderungsverlauf + Frontend-Version: immer neu prüfen (no-cache + ETag), sonst zeigt der Browser
    # nach einem Update die alte Version.
    # try_files ohne index.html-Fallback: fehlt die Datei, kommt ein echtes 404 statt HTML mit Status 200.
    location = /changelog.json {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Größte erwartete Anfrage (Parqet-Sammelimport) liegt weit unter 1 MB; das Backend begrenzt
    # auf 2 MB (MAX_CONTENT_LENGTH) — nginx lässt dieselbe Grenze zu statt seines Standards 1 MB.
    client_max_body_size 2m;

    location /api/ {
        limit_req zone=rl_heavy    burst=3   nodelay;
        limit_req zone=rl_outbound burst=50  nodelay;
        limit_req zone=rl_pin      burst=5   nodelay;
        limit_req zone=rl_general  burst=100 nodelay;
        # Greift nur für von nginx selbst erzeugte Fehler (limit_req) — 429 des Backends bleiben unangetastet
        error_page 429 = @rate_limited;

        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # JSON-Antwort, damit das Frontend die Meldung wie jeden anderen API-Fehler (`error`) anzeigen kann.
    # Bewusst nur ASCII (keine Umlaute) — vermeidet Zeichensatz-Probleme in der nginx-Konfiguration.
    location @rate_limited {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Retry-After "10" always;
        return 429 '{"error":"Zu viele Anfragen, bitte kurz warten und erneut versuchen"}';
    }
}
