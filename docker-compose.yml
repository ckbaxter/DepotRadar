# DepotRadar — läuft komplett aus Images, ein Klon des Repositorys ist nicht nötig.
# Einstellungen stehen in einer optionalen Datei `.env` neben dieser Datei (Vorlage: .env.example);
# ohne `.env` gelten die Standardwerte hinter `:-`.

services:
  # ⚠ Service-Namen nicht ändern: Die nginx-Konfiguration im Web-Image leitet /api/ an http://backend:5000
  #   weiter, und das Backend liest die installierte Frontend-Version von http://nginx/changelog.json.
  backend:
    image: ghcr.io/ckbaxter/depotradar-backend:latest
    container_name: depotradar-backend
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - APP_URL=${APP_URL:-http://localhost:8080}   # Eigene URL/IP — wichtig für Parqet OAuth
      - OPENFIGI_API_KEY=${OPENFIGI_API_KEY:-}
      - ADMIN_USERS=${ADMIN_USERS:-}
      - RESET_PIN_USER=${RESET_PIN_USER:-}          # One-Shot, siehe README
      - DELETE_USER=${DELETE_USER:-}                # One-Shot, siehe README
    networks:
      - depotradar-net

  nginx:
    image: ghcr.io/ckbaxter/depotradar-web:latest
    container_name: depotradar-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - depotradar-net

networks:
  depotradar-net:
    driver: bridge
